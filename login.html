<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ФотоТранзит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="logo" href="index.html"><span class="mark" aria-hidden="true"></span>ФотоТранзит</a>
      <a class="btn btn-line" href="register.html">Зарегистрироваться</a>
    </div>
  </header>
  <main class="auth">
    <h1>Вход</h1>
    <form id="login-form">
      <label>Телефон или email<input id="login-id" type="text" required autocomplete="username" placeholder="+7 900 000-00-00 или почта"></label>
      <label>Пароль<input id="login-pass" type="password" required placeholder="Ваш пароль"></label>
      <p class="hint" id="login-error" hidden></p>
      <button class="btn btn-dark btn-wide" type="submit">Войти</button>
    </form>
    <div class="auth-social">
      <button class="btn btn-line btn-wide" id="via-vk" type="button">Войти через ВКонтакте</button>
      <button class="btn btn-line btn-wide" id="via-google" type="button">Войти через Google</button>
      <p class="hint" id="oauth-note" hidden></p>
    </div>
    <p class="hint"><a href="forgot.html">Забыли пароль?</a></p>
    <p class="hint"><a href="register.html">Нет аккаунта? Зарегистрироваться</a></p>
  </main>
  <script src="auth.js?v=lk6"></script>
</body>
</html>
