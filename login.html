<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ФотоТранзит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="logo" href="index.html"><span class="mark" aria-hidden="true"></span>ФотоТранзит</a>
      <a class="btn btn-line" href="register.html">Зарегистрироваться</a>
    </div>
  </header>
  <main class="auth">
    <h1>Вход</h1>
    <p class="sub">Логин — это почта, которую вы указали при регистрации.</p>
    <form action="cabinet.html">
      <label>Email<input type="email" name="email" required placeholder="anna@studio.ru"></label>
      <label>Пароль<input type="password" name="password" required placeholder="Ваш пароль"></label>
      <label class="check"><input type="checkbox" name="remember"> Запомнить меня</label>
      <button class="btn btn-dark btn-wide" type="submit">Войти</button>
    </form>
    <p class="hint"><a href="forgot.html">Забыли пароль?</a></p>
    <p class="hint"><a href="register.html">Нет аккаунта? Зарегистрироваться</a></p>
  </main>
</body>
</html>
