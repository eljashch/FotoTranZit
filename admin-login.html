<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход администратора — ФотоТранзит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="logo" href="index.html"><span class="mark" aria-hidden="true"></span>ФотоТранзит</a>
    </div>
  </header>
  <main class="auth">
    <h1>Вход администратора</h1>
    <p class="sub">Отдельный вход. Кабинет фотографа отсюда не открывается.</p>
    <form id="admin-login">
      <label>Логин<input id="admin-user" type="text" required autocomplete="username"></label>
      <label>Пароль<input id="admin-pass" type="password" required autocomplete="current-password"></label>
      <button class="btn btn-dark btn-wide" type="submit">Войти</button>
    </form>
    <p class="hint" id="admin-login-note" hidden></p>
    <p class="hint">Прототип без сервера: логин admin, пароль admin.</p>
  </main>
  <script src="site.js"></script>
</body>
</html>
