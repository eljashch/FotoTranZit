<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница фотографа — ФотоТранзит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="site-header"><div class="wrap header-row"><a class="logo" href="index.html"><span class="mark" aria-hidden="true"></span>ФотоТранзит</a><a class="btn btn-line" id="to-cabinet" href="profile.html">В кабинет</a></div></header>
  <main class="legal">
    <div class="person-head">
      <div class="person-marks">
        <div class="portrait-frame" data-portrait hidden>
          <div class="portrait-clip">
            <img class="portrait" data-use="photo" data-empty="1" alt="">
          </div>
        </div>
        <div class="portrait-frame logo-frame" data-logo-frame hidden>
          <div class="portrait-clip">
            <img class="portrait" data-use="logo" alt="">
          </div>
        </div>
      </div>
      <div class="person-copy">
        <p class="kicker" id="ph-role"></p>
        <h1 id="ph-name">Фотограф</h1>
        <p id="ph-about"></p>
        <div class="contacts" id="ph-contacts"></div>
      </div>
    </div>
    <section class="page-works" id="page-works">
      <div class="who">
        <h2>Съёмки</h2>
        <div class="add-slot">
          <button class="btn btn-dark" id="page-add" type="button" aria-expanded="false" aria-haspopup="true">Добавить</button>
          <div class="add-menu" id="page-add-menu" hidden>
            <button type="button" id="page-add-gallery">Галерея</button>
            <button type="button" id="page-add-photos">Фотографии</button>
          </div>
          <input id="page-photo-input" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
        </div>
      </div>
      <div id="page-board"></div>
    </section>
    <h2>Отзывы</h2>
    <article class="review"><strong>Илья</strong><div class="stars">★★★★★</div><p>Удобно отмечать кадры в альбом прямо с телефона.</p></article>
    <article class="review"><strong>Ольга</strong><div class="stars">★★★★☆</div><p>Красиво и без лишних папок на диске.</p></article>
    <article class="review"><strong>Марина</strong><div class="stars">★★★★★</div><p>Родители в саду получили каждый свою ссылку.</p></article>
  </main>
  <div class="overlay" id="page-ask" hidden>
    <form class="modal">
      <h2>Удалить?</h2>
      <p class="hint" id="page-ask-text"></p>
      <div class="row-actions">
        <button class="btn btn-dark" type="button" id="page-ask-yes">Удалить</button>
        <button class="btn btn-line" type="button" id="page-ask-no">Отмена</button>
      </div>
    </form>
  </div>
  <script src="site.js"></script>
</body>
</html>
