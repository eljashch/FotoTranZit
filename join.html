<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — ФотоТранзит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="light-app" data-app="join">
  <header class="light-bar">
    <a class="logo" href="role.html"><span class="mark" aria-hidden="true"></span>ФотоТранзит</a>
  </header>
  <main class="light-main">
    <form class="auth-light join-form" id="join-shell">
      <h1>Регистрация</h1>
      <div id="parent-join">
        <label>ФИО родителя<input id="join-name" type="text" autocomplete="name"></label>
        <label>Телефон<input id="join-phone" type="tel" autocomplete="tel"></label>
        <button class="light-btn" type="button" id="join-go">Зарегистрироваться</button>
        <p class="hint" id="join-error" hidden></p>
      </div>
    </form>
  </main>
  <script src="phone.js"></script>
  <script src="shoot.js"></script>
</body>
</html>
