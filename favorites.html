<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отмеченное — ФотоТранзит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="g-top">
    <p class="kicker"><a href="gallery.html">К галерее</a></p>
    <h1>Мария, 8 кадров</h1>
    <div class="g-grid">
      <article class="shot"><img src="img/p1.jpg" alt=""></article>
      <article class="shot tall"><img src="img/cover.jpg" alt=""></article>
      <article class="shot"><img src="img/p5.jpg" alt=""></article>
      <article class="shot"><img src="img/p6.jpg" alt=""></article>
    </div>
    <form class="panel" style="margin:16px 0 40px">
      <label>Комментарий к съёмке<textarea>Кадр с букетом — в альбом.</textarea></label>
      <div class="row-actions">
        <button class="btn btn-dark" type="button" data-download>Скачать отмеченные</button>
        <button class="btn btn-line" type="button">Уменьшенные</button>
      </div>
    </form>
  </header>
  <div class="overlay" id="review-modal" hidden>
    <form class="modal"><h2>Готовим архив</h2><button class="btn btn-line" type="button" data-close="review-modal">Закрыть</button></form>

  <script src="site.js"></script>
